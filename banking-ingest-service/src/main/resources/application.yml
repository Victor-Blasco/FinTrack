server:
  port: ${PORT_INGEST_SERVICE:8082}

spring:
  application:
    name: banking-ingest-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintrack_db}
    username: ${DB_USER:fintrack_user}
    password: ${DB_PASSWORD:fintrack_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  kafka:
    topics:
      raw-transactions: raw-transactions
