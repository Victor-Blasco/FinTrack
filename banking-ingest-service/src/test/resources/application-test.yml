server:
  port: 0

spring:
  application:
    name: banking-ingest-service-test
  datasource:
    url: jdbc:h2:mem:ingest_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092

app:
  kafka:
    topics:
      raw-transactions: raw-transactions-test
