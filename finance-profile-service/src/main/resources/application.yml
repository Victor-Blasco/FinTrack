server:
  port: ${PORT_PROFILE_SERVICE:8085}

spring:
  application:
    name: finance-profile-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fintrack_db}
    username: ${DB_USER:fintrack_user}
    password: ${DB_PASSWORD:fintrack_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: finance-profile-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.victorblasco.fintrack.profile: INFO
    org.springframework.kafka: INFO
